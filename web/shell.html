<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volatile</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Keyboard callbacks are bound to the canvas, so it must hold focus.
  var canvas = document.getElementById('canvas');
  window.addEventListener('pointerdown', function () { canvas.focus(); });
  var Module = { canvas: canvas, onRuntimeInitialized: function () { canvas.focus(); } };
</script>
{{{ SCRIPT }}}
</body>
</html>
